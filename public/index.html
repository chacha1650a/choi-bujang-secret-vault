<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 로그인한 자료실</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#101a28">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .card { margin: 22px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .notice { border-color: #d07384; color: #ffe3e8; background: #612a3544; }
    label { display: block; margin: 10px 0 4px; font-size: 14px; color: #bfd0e5; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font: inherit; }
    textarea { min-height: 84px; resize: vertical; }
    button { margin: 12px 8px 0 0; padding: 9px 16px; border: 1px solid #8ad8df; border-radius: 10px; background: transparent; color: #8ad8df; font: inherit; font-weight: 700; cursor: pointer; }
    button.danger { border-color: #d07384; color: #ffb3c0; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    #message { min-height: 1.4em; color: #ffd28a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 나만의 접속 앱</div>
    <h1>로그인한 자료실</h1>
    <p>자료는 서버에 있고, 서버가 로그인과 이 기기의 승인을 직접 확인해야 보입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="card notice">앱을 설치했다는 표시만으로는 기기 확인이 끝나지 않습니다. 기기 승인은 서버의 명단으로만 정해집니다. 로그인 정보는 이 창의 메모리에만 두므로 새로고침하면 다시 로그인합니다.</div>
    <div id="message" role="status" aria-live="polite"></div>

    <form id="login" class="card">
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      <button type="submit">로그인</button>
      <button type="button" id="signup">가입</button>
    </form>

    <section id="session" hidden>
      <div class="card">
        <span id="who"></span>
        <button type="button" id="logout">로그아웃</button>
      </div>
      <div id="device" class="card" aria-live="polite">
        <strong>이 기기의 상태</strong>
        <p id="device-state">서버에 이 기기의 승인 여부를 묻는 중입니다.</p>
        <button type="button" id="device-request" hidden>이 기기 승인 요청</button>
        <button type="button" id="device-refresh" hidden>승인 상태 다시 확인</button>
      </div>
    </section>

    <section id="vault" hidden>
      <form id="editor" class="card">
        <label for="title">제목</label>
        <input id="title" maxlength="200" required>
        <label for="body">내용</label>
        <textarea id="body" maxlength="5000" required></textarea>
        <button type="submit" id="save">추가</button>
        <button type="button" id="cancel" hidden>취소</button>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    // 이 두 값은 브라우저에 넣어도 되는 공개용입니다. 서버 전용 키는 이 파일에 없습니다.
    const SUPABASE_URL = 'https://qnhghbipylyhzoyhkkgl.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_0ob3zQmenT9MOOcxmrpaHw_ri91--ge';

    // 11단계: 로그인 토큰을 브라우저 저장소(localStorage 등)에 넣지 않고 이 창의 메모리에만 둡니다.
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false },
    });
    const $ = (id) => document.getElementById(id);
    let editingId = null;

    const say = (text) => { $('message').textContent = text; };

    async function api(path, options = {}) {
      const { data } = await supabase.auth.getSession();
      const token = data.session?.access_token;
      const response = await fetch(path, {
        ...options,
        cache: 'no-store',
        headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
      });
      if (response.status === 204) return null;
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.message || result.error || `요청 실패 (HTTP ${response.status})`);
      return result;
    }

    function resetEditor() {
      editingId = null;
      $('editor').reset();
      $('save').textContent = '추가';
      $('cancel').hidden = true;
    }

    async function loadNotes() {
      const notes = await api('/api/my/notes');
      const items = notes.map((note) => {
        const li = document.createElement('li');
        li.className = 'card';
        const title = document.createElement('strong');
        const body = document.createElement('span');
        title.textContent = note.title;
        body.textContent = note.body;
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '수정';
        edit.addEventListener('click', () => {
          editingId = note.id;
          $('title').value = note.title;
          $('body').value = note.body;
          $('save').textContent = '저장';
          $('cancel').hidden = false;
        });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'danger';
        remove.textContent = '삭제';
        remove.addEventListener('click', async () => {
          try { await api(`/api/notes/${note.id}`, { method: 'DELETE' }); await loadNotes(); say('삭제했습니다.'); }
          catch (error) { say(error.message); }
        });
        li.append(title, body, edit, remove);
        return li;
      });
      if (!items.length) {
        const empty = document.createElement('li');
        empty.textContent = '아직 메모가 없습니다. 위에서 추가해 보세요.';
        items.push(empty);
      }
      $('notes').replaceChildren(...items);
    }

    // 11단계: 서버가 이 기기를 승인된 기기로 확인한 뒤에만 자료실(메모)을 엽니다.
    // 승인 여부는 서버 응답으로만 판단하고, 기기 ID는 자바스크립트가 읽을 수 없는 쿠키로만 서버와 주고받습니다.
    async function checkDevice() {
      $('vault').hidden = true;
      $('notes').replaceChildren();
      const status = await api('/api/device/status');
      const messages = {
        device_approved: '서버가 이 기기를 승인했습니다. 자료실을 엽니다.',
        approval_pending: '승인 요청을 보냈습니다. 강사가 서버에서 승인하기 전에는 자료가 열리지 않습니다.',
        device_revoked: '이 기기의 승인이 회수됐습니다. 자료를 열 수 없습니다.',
        device_not_registered: '이 기기는 아직 승인되지 않았습니다. 승인 전에는 메모를 보여 주지 않습니다.',
      };
      $('device-state').textContent = messages[status.reason] ?? '이 기기의 승인 여부를 확인하지 못했습니다.';
      $('device-request').hidden = status.approved || status.reason !== 'device_not_registered';
      $('device-refresh').hidden = status.approved;
      if (!status.approved) return;
      $('vault').hidden = false;
      await loadNotes();
    }

    async function render(session) {
      const loggedIn = Boolean(session);
      $('login').hidden = loggedIn;
      $('session').hidden = !loggedIn;
      if (!loggedIn) { $('vault').hidden = true; $('notes').replaceChildren(); resetEditor(); return; }
      $('who').textContent = `${session.user.email} 로 로그인했습니다.`;
      try { await checkDevice(); } catch (error) { say(error.message); }
    }

    $('device-request').addEventListener('click', async () => {
      try { await api('/api/device/request', { method: 'POST' }); await checkDevice(); }
      catch (error) { say(error.message); }
    });
    $('device-refresh').addEventListener('click', async () => {
      try { await checkDevice(); } catch (error) { say(error.message); }
    });

    $('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      say('');
      const { error } = await supabase.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
      if (error) say(`로그인하지 못했습니다: ${error.message}`);
      $('password').value = '';
    });
    $('signup').addEventListener('click', async () => {
      say('');
      if (!$('login').reportValidity()) return;
      const { data, error } = await supabase.auth.signUp({ email: $('email').value, password: $('password').value });
      $('password').value = '';
      if (error) say(`가입하지 못했습니다: ${error.message}`);
      else if (!data.session) say('가입했습니다. 확인 메일의 링크를 누른 뒤 로그인해 주세요.');
    });
    $('logout').addEventListener('click', async () => { await supabase.auth.signOut(); say('로그아웃했습니다.'); });
    $('cancel').addEventListener('click', resetEditor);
    $('editor').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = JSON.stringify({ title: $('title').value, body: $('body').value });
      try {
        if (editingId) await api(`/api/notes/${editingId}`, { method: 'PUT', body: payload });
        else await api('/api/notes', { method: 'POST', body: payload });
        resetEditor();
        await loadNotes();
        say('저장했습니다.');
      } catch (error) { say(error.message); }
    });

    // 설치형 웹앱: 서비스 워커는 오프라인 안내 화면만 저장합니다(메모·API 응답은 저장하지 않음).
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    supabase.auth.onAuthStateChange((_event, session) => { render(session); });
    render((await supabase.auth.getSession()).data.session);
  </script>
</body>
</html>
